name: Build Standalone VS Code APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-arm64-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Project Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Unpack Flattened Repo Files (app__*) Without Changing App Code
        run: |
          for f in app__*; do
            if [ -f "$f" ]; then
              target=$(echo "$f" | sed 's/__/\//g')
              mkdir -p "$(dirname "$target")"
              cp -f "$f" "$target"
            fi
          done

      - name: Fix APK Install Flags (useLegacyPackaging, extractNativeLibs, VersionCode & Package ID)
        run: |
          python3 - << 'EOF'
          import os, re

          # 1. Patch app/build.gradle.kts for APK installation compatibility
          gradle_path = "app/build.gradle.kts"
          if os.path.exists(gradle_path):
              with open(gradle_path, "r", encoding="utf-8") as f:
                  g = f.read()

              # Set clean applicationId to avoid conflict with old repo installs, keeping namespace intact
              g = re.sub(r'applicationId\s*=\s*"[^"]*"', 'applicationId = "com.pocket.vscode.ide"', g)

              # Bump versionCode to 2000 + run_number so Android never blocks for version downgrade
              run_num = int(os.environ.get("GITHUB_RUN_NUMBER", "1"))
              ver_code = 2000 + run_num
              g = re.sub(r'versionCode\s*=\s*\d+', f'versionCode = {ver_code}', g)

              # Add useLegacyPackaging = true (Mandatory for patchelf-modified libproot.so) and noCompress for tar/xz/gz
              packaging_block = """
              packaging {
                  jniLibs {
                      useLegacyPackaging = true
                  }
              }
              androidResources {
                  noCompress += listOf("xz", "gz", "tar", "so", "bin")
              }
              """
              if "useLegacyPackaging" not in g:
                  g = re.sub(r'(android\s*\{)', r'\1\n' + packaging_block, g, count=1)

              with open(gradle_path, "w", encoding="utf-8") as f:
                  f.write(g)

          # 2. Patch AndroidManifest.xml to ensure extractNativeLibs="true" and valid exported flags
          manifest_path = "app/src/main/AndroidManifest.xml"
          if os.path.exists(manifest_path):
              with open(manifest_path, "r", encoding="utf-8") as f:
                  m = f.read()

              m = re.sub(r'android:testOnly="[^"]*"', '', m)
              if 'android:extractNativeLibs=' in m:
                  m = re.sub(r'android:extractNativeLibs="[^"]*"', 'android:extractNativeLibs="true"', m)
              else:
                  m = re.sub(r'<application', '<application android:extractNativeLibs="true"', m, count=1)

              with open(manifest_path, "w", encoding="utf-8") as f:
                  f.write(m)
          EOF

      - name: Generate Official VS Code Launcher Icons (If Not Present in res/mipmap)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-pil curl

          rm -rf app/src/main/res/mipmap-anydpi*
          curl -fSL "https://raw.githubusercontent.com/microsoft/vscode/main/resources/linux/code.png" -o vscode_icon.png

          python3 - << 'EOF'
          import os, re
          from PIL import Image, ImageDraw

          img = Image.open("vscode_icon.png").convert("RGBA")
          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192
          }

          for folder, size in sizes.items():
              dest_dir = os.path.join("app/src/main/res", folder)
              os.makedirs(dest_dir, exist_ok=True)

              card = Image.new("RGBA", (size, size), (30, 30, 30, 255))
              inner = int(size * 0.76)
              logo = img.resize((inner, inner), Image.Resampling.LANCZOS)
              off = (size - inner) // 2
              card.paste(logo, (off, off), logo)
              card.save(os.path.join(dest_dir, "ic_launcher.png"))

              mask = Image.new("L", (size, size), 0)
              draw = ImageDraw.Draw(mask)
              draw.ellipse((0, 0, size - 1, size - 1), fill=255)
              round_card = Image.new("RGBA", (size, size), (0, 0, 0, 0))
              round_card.paste(card, (0, 0), mask)
              round_card.save(os.path.join(dest_dir, "ic_launcher_round.png"))

          manifest_path = "app/src/main/AndroidManifest.xml"
          if os.path.exists(manifest_path):
              with open(manifest_path, "r", encoding="utf-8") as f:
                  c = f.read()
              if 'android:icon=' in c:
                  c = re.sub(r'android:icon="[^"]*"', 'android:icon="@mipmap/ic_launcher"', c)
              else:
                  c = re.sub(r'<application', '<application android:icon="@mipmap/ic_launcher"', c, count=1)
              if 'android:roundIcon=' in c:
                  c = re.sub(r'android:roundIcon="[^"]*"', 'android:roundIcon="@mipmap/ic_launcher_round"', c)
              else:
                  c = re.sub(r'<application', '<application android:roundIcon="@mipmap/ic_launcher_round"', c, count=1)
              with open(manifest_path, "w", encoding="utf-8") as f:
                  f.write(c)
          EOF

      - name: Run Repo fetch-native-proot.sh & Bundle Offline Assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y patchelf binutils curl

          if [ -f "fetch-native-proot.sh" ]; then
            chmod +x fetch-native-proot.sh
            ./fetch-native-proot.sh || true
          fi

          DEST="$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a"
          mkdir -p "$DEST"
          if [ ! -f "$DEST/libproot.so" ]; then
            mkdir -p /tmp/debs
            cd /tmp/debs
            PACKAGES_URL="https://packages.termux.dev/apt/termux-main/dists/stable/main/binary-aarch64/Packages"
            curl -sL "$PACKAGES_URL" -o Packages
            PROOT_DEB_PATH=$(awk '/^Package: proot$/,/^$/' Packages | grep '^Filename:' | head -n 1 | awk '{print $2}')
            TALLOC_DEB_PATH=$(awk '/^Package: libtalloc$/,/^$/' Packages | grep '^Filename:' | head -n 1 | awk '{print $2}')
            SHMEM_DEB_PATH=$(awk '/^Package: libandroid-shmem$/,/^$/' Packages | grep '^Filename:' | head -n 1 | awk '{print $2}')
            if [ -z "$SHMEM_DEB_PATH" ]; then
              SHMEM_DEB_PATH=$(grep -E 'libandroid-shmem.*_aarch64\.deb' Packages | head -n 1 | awk '{print $2}')
            fi
            curl -sL "https://packages.termux.dev/apt/termux-main/$PROOT_DEB_PATH" -o proot.deb
            curl -sL "https://packages.termux.dev/apt/termux-main/$TALLOC_DEB_PATH" -o talloc.deb
            curl -sL "https://packages.termux.dev/apt/termux-main/$SHMEM_DEB_PATH" -o shmem.deb
            mkdir -p extract
            for f in proot.deb talloc.deb shmem.deb; do
              mkdir -p "extract/$f"
              cd "extract/$f"
              ar x "/tmp/debs/$f"
              tar -xf data.tar.*
              cd /tmp/debs
            done
            TALLOC_SRC=$(find extract -name "libtalloc.so*" | head -n 1)
            cp "$TALLOC_SRC" "$DEST/libtalloc.so"
            patchelf --set-soname libtalloc.so "$DEST/libtalloc.so"
            patchelf --set-rpath '$ORIGIN' "$DEST/libtalloc.so" || true
            SHMEM_SRC=$(find extract -name "libandroid-shmem.so*" | head -n 1)
            cp "$SHMEM_SRC" "$DEST/libandroid-shmem.so"
            patchelf --set-soname libandroid-shmem.so "$DEST/libandroid-shmem.so"
            patchelf --set-rpath '$ORIGIN' "$DEST/libandroid-shmem.so" || true
            PROOT_SRC=$(find extract -path "*/usr/bin/proot" | head -n 1)
            cp "$PROOT_SRC" "$DEST/libproot.so"
            patchelf --replace-needed libtalloc.so.2 libtalloc.so "$DEST/libproot.so" || true
            patchelf --set-rpath '$ORIGIN' "$DEST/libproot.so"
            LOADER_SRC=$(find extract -path "*/libexec/proot/loader" | head -n 1)
            cp "$LOADER_SRC" "$DEST/libproot-loader.so"
            chmod 755 "$DEST/"*.so*
            cd "$GITHUB_WORKSPACE"
          fi

          mkdir -p app/src/main/assets
          python3 - << 'EOF'
          import urllib.request, json, subprocess, os, sys
          urls = []
          try:
              res = subprocess.run(["gh", "api", "repos/termux/proot-distro/releases?per_page=100"], capture_output=True, text=True)
              for rel in json.loads(res.stdout):
                  for asset in rel.get("assets", []):
                      n = asset.get("name", "")
                      if "debian" in n and "aarch64" in n and ("tar.xz" in n or "tar.gz" in n):
                          urls.append(asset.get("browser_download_url"))
          except Exception:
              pass
          urls.append("https://raw.githubusercontent.com/debuerreotype/docker-debian-artifacts/dist-arm64v8/bookworm/rootfs.tar.xz")
          urls.append("http://cdimage.ubuntu.com/ubuntu-base/releases/22.04/release/ubuntu-base-22.04-base-arm64.tar.gz")
          ok = False
          for u in urls:
              try:
                  req = urllib.request.Request(u, headers={"User-Agent": "Mozilla/5.0"})
                  with urllib.request.urlopen(req, timeout=60) as r:
                      ext = ".xz" if "xz" in u else ".gz"
                      dest = f"app/src/main/assets/debian-rootfs.tar{ext}"
                      with open(dest, "wb") as f:
                          while True:
                              c = r.read(1024 * 1024)
                              if not c: break
                              f.write(c)
                      if os.path.getsize(dest) > 10 * 1024 * 1024:
                          ok = True
                          break
              except Exception:
                  pass
          if not ok:
              sys.exit(1)
          EOF
          curl -fSL -H "User-Agent: Mozilla/5.0" "https://update.code.visualstudio.com/latest/linux-arm64/stable" -o app/src/main/assets/vscode-linux-arm64.tar.gz

      - name: Setup Permanent Keystore from Repo (app/keystore.jks)
        run: |
          mkdir -p ~/.android
          if [ -f "app/keystore.jks" ]; then
            cp -f app/keystore.jks ~/.android/debug.keystore
          else
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=PocketVSCode, OU=Dev, O=Standalone, L=Bijnor, ST=UP, C=IN"
            mkdir -p app
            cp -f ~/.android/debug.keystore app/keystore.jks
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Assemble, Zipalign & Sign APK (v1 + v2 + v3)
        run: |
          gradle wrapper --gradle-version 8.7
          ./gradlew assembleDebug --no-daemon

          RAW_APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)

          "$BUILD_TOOLS_DIR/zipalign" -p -f -v 4 "$RAW_APK" aligned.apk
          "$BUILD_TOOLS_DIR/apksigner" sign \
            --ks ~/.android/debug.keystore \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out PocketVSCode-arm64.apk \
            aligned.apk

          "$BUILD_TOOLS_DIR/apksigner" verify --verbose PocketVSCode-arm64.apk

      - name: Publish Direct APK to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TAG="v1.0.${{ github.run_number }}"
          gh release create "$RELEASE_TAG" PocketVSCode-arm64.apk \
            --target "${{ github.sha }}" \
            --title "Pocket VS Code ($RELEASE_TAG)" \
            --notes "Fixed APK installation (useLegacyPackaging + extractNativeLibs + zipalign + v1/v2/v3 signing) with zero changes to app code."

      - name: Upload Artifact Backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Pocket-VS-Code-arm64-v8a-APK
          path: PocketVSCode-arm64.apk
